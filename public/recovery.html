<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151a"><title>存档救援 · 忍者手记</title>
  <link rel="stylesheet" href="css/recovery.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">SHINOBI ARCHIVE · RECOVERY</span><h1>让冒险继续。</h1><p>游戏打不开时，也可以在这里保留原档、导出备份，或从最近的回合继续。</p></header>
    <section aria-labelledby="current-title"><div class="section-heading"><h2 id="current-title">当前档案</h2><a href="index.html">返回游戏 ↗</a></div><p id="current">正在读取存档目录…</p>
      <div class="actions"><button id="backup" class="primary">保留原档备份</button><button id="export-current">直接导出当前档</button><button id="rescue">备份并生成续玩副本</button><button id="new-game">保留旧档并开新档</button></div>
      <label class="scope">续玩副本保留最近 <input id="keep-turns" aria-label="续玩副本保留回合数" type="number" min="1" step="1" value="100" required> 回合的正文与回退点；默认 100，可自行填写，当前角色、变量和历史记忆保留。</label>
      <p class="muted">备份完成并校验后才会切换。失败或取消时，当前档案保持不变。请关闭其他游戏标签页再操作。</p>
    </section>
    <div class="status-row"><p id="status" role="status" aria-live="polite">准备就绪</p><button id="cancel" hidden>取消操作</button></div>
    <section aria-labelledby="archive-title"><div class="section-heading"><h2 id="archive-title">保留的原档</h2><button id="refresh">刷新</button></div><div id="archives"></div></section>
    <footer>此页面只读取当前浏览器、当前站点的存档。请导出文件备份；清除网站数据会删除本地档案。</footer>
  </main>
  <script type="module" src="js/recovery.js"></script>
</body></html>
