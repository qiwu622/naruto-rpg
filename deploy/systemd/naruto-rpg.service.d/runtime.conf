[Service]
ExecStart=
ExecStart=/opt/naruto-runtime/node-v22.23.2-linux-x64/bin/node server/index.js
Environment="PATH=/opt/naruto-runtime/node-v22.23.2-linux-x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
# The cgroup limit is intentionally higher than the V8 old-generation heap so
# native buffers, SQLite and connection state retain headroom under load.
Environment="NODE_OPTIONS=--max-old-space-size=256"
