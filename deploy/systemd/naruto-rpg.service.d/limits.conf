[Service]
# Keep the latency-sensitive Node/SQLite working set resident even while
# unrelated host processes have cold pages in swap. The V8 old-generation
# heap remains independently capped at 256 MiB by runtime.conf.
MemoryLow=192M
MemoryHigh=320M
MemoryMax=448M
MemorySwapMax=32M
OOMPolicy=kill
Restart=on-failure
RestartSec=5s
# The application drains HTTP/SSE for at most 30 seconds before closing the
# SQLite lifecycle lock. Keep a separate systemd margin so SIGKILL cannot race
# the application's own drain timer and leave the single-writer lock stale.
TimeoutStopSec=45s
