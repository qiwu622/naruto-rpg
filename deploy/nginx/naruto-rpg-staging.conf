server {
    listen 8080 ssl;
    server_name www.qiwu.asia;
    client_max_body_size 200m;

    ssl_certificate /etc/letsencrypt/live/www.qiwu.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qiwu.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Staging 'true' always;
    root /var/www/naruto-rpg-staging;
    include /etc/nginx/snippets/naruto-rpg-android-download.conf;

    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Preserve the externally visible :8080 origin for server-side
        # same-origin and CSRF checks. $host drops the non-default port.
        proxy_set_header Host $server_name:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 生成不再自动切断(用户手动停止)：/api 读取超时放宽到 1 小时，禁用缓冲以流式透传。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /_staging_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $server_name:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 401 = @staging_login;
    error_page 403 = @staging_banned;

    location @staging_login {
        return 302 /login.html;
    }

    location @staging_banned {
        return 302 /login.html?error=banned;
    }

    location = / {
        auth_request /_staging_auth;
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        auth_request /_staging_auth;
        try_files /index.html =404;
        expires -1;
    }

    location = /admin.html { try_files /admin.html =404; }
    location = /login.html { try_files /login.html =404; }
    location = /privacy.html { try_files /privacy.html =404; }
    location = /terms.html { try_files /terms.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control 'public, max-age=60';
    }

    location ~* \.(js|mjs|css)$ {
        expires off;
        add_header Cache-Control 'no-cache, must-revalidate' always;
    }

    location ~* \.woff2?$ {
        expires 1h;
    }

    location = /sw.js {
        expires off;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
