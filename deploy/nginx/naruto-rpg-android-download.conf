# Shared by the website and staging site. APKs live outside frontend releases.
location = /app/android/naruto-rpg.apk {
    alias /var/www/naruto-rpg-downloads/android/naruto-rpg.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="naruto-rpg.apk"';
    add_header Cache-Control 'no-store' always;
}

location = /app/android/update.json {
    alias /var/www/naruto-rpg-downloads/android/update.json;
    types { }
    default_type application/json;
    add_header Cache-Control 'no-store' always;
    add_header Access-Control-Allow-Origin '*' always;
}
